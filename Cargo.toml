[package]
name = "osrs-ge-calc"
version = "0.3.1"
edition = "2024"
authors = ["N3cro0oDev"]

[dependencies]
iced = { version = "0.14.0", features = ["canvas", "smol"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
serde-xml-rs = "0.8.2"
num-format = "0.4.4"
webbrowser = "1.1.0"
dirs = "6.0.0"
plotters-iced2 = "0.14"
plotters = "0.3.7"
chrono = "0.4.44"
iced_aw = { version = "0.13.0", features = ["full"] }